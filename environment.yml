name: geo_api_311
channels:
  # conda-forge ships the geospatial binaries (GeoPandas, Shapely, pyproj, GDAL)
  - conda-forge
dependencies:
  - python=3.11
  - fastapi>=0.110
  - uvicorn>=0.29
  - pydantic>=2.0.0
  - python-dotenv>=1.0
  - pandas>=2.0
  - geopandas>=0.14
  - sqlalchemy>=2.0
  - greenlet>=3.0
  - sqlmodel>=0.0.22
  - asyncpg>=0.29
  - httpx>=0.27
  - python-multipart>=0.0.9
  - pytest>=7.0.0
  - pip
  - pip:
      - ruff>=0.6
      - tox>=4.0
      - mypy>=1.10
